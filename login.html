<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Identity | Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons UMD Build -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    @keyframes move {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(10%, 15%) scale(1.1); }
      100% { transform: translate(0, 0) scale(1); }
    }
    .animate-blob {
      animation: move 20s infinite alternate linear;
    }
    .delay-2000 { animation-delay: 2s; }
    .delay-4000 { animation-delay: 4s; }

    body {
      background: #020617;
      overflow: hidden;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .hidden-state {
      display: none !important;
    }
    
    /* Ensure icons have a baseline size before Lucide loads */
    i[data-lucide] {
      display: inline-block;
      width: 1.25rem;
      height: 1.25rem;
    }
  </style>
</head>
<body class="text-slate-200 selection:bg-indigo-500/30">
  
  <!-- Dynamic Animated Background -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-indigo-600/20 blur-[120px] rounded-full animate-blob"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-purple-600/20 blur-[120px] rounded-full animate-blob delay-2000"></div>
    <div class="absolute top-[20%] right-[10%] w-[30%] h-[30%] bg-blue-600/10 blur-[100px] rounded-full animate-blob delay-4000"></div>
    <div class="absolute inset-0 bg-[url('https://grainy-gradients.vercel.app/noise.svg')] opacity-20 brightness-100 contrast-150"></div>
    <div class="absolute inset-0 bg-[linear-gradient(to_right,#80808012_1px,transparent_1px),linear-gradient(to_bottom,#80808012_1px,transparent_1px)] bg-[size:40px_40px]"></div>
  </div>

  <!-- Home Icon/Button (Top Left) -->
  <div class="fixed top-6 left-6 z-50">
    <a href="index.html" class="glass-card flex items-center space-x-2 px-4 py-2 rounded-xl border border-white/10 hover:bg-white/10 transition-all hover:scale-105 active:scale-95 text-slate-300 hover:text-white group">
      <i data-lucide="home" class="w-4 h-4 group-hover:text-indigo-400 transition-colors"></i>
      <span class="text-sm font-medium tracking-tight">Home</span>
    </a>
  </div>

  <div class="relative min-h-screen w-full flex items-center justify-center p-4">
    <div class="relative w-full max-w-md group">
      <div class="absolute -inset-1 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-3xl blur opacity-20 group-hover:opacity-40 transition duration-1000"></div>
      
      <div class="glass-card relative rounded-3xl p-8 shadow-2xl overflow-hidden">
        <div class="text-center mb-10">
          <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-600 to-purple-600 shadow-lg shadow-indigo-500/20 mb-6">
            <i data-lucide="lock" class="w-8 h-8 text-white"></i>
          </div>
          <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-b from-white to-slate-400 tracking-tight">DTTT MUMBAI</h1>
          <p class="text-slate-400 mt-2 text-sm font-medium">Login</p>
        </div>

        <form class="space-y-6">
          <div class="space-y-2 group/input">
            <label class="text-xs font-semibold text-slate-500 uppercase tracking-widest ml-1">Username</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <i data-lucide="user" class="h-5 w-5 text-slate-500"></i>
              </div>
              <input type="text" class="block w-full pl-11 pr-4 py-3 bg-white/5 border border-white/10 rounded-2xl text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20" placeholder="Username" />
            </div>
          </div>

          <div class="space-y-2 group/input">
            <label class="text-xs font-semibold text-slate-500 uppercase tracking-widest ml-1">Password</label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                <i data-lucide="shield-check" class="h-5 w-5 text-slate-500"></i>
              </div>
              <input type="password" class="block w-full pl-11 pr-4 py-3 bg-white/5 border border-white/10 rounded-2xl text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20" placeholder="••••••••" />
            </div>
          </div>

          <button type="submit" class="group relative w-full flex items-center justify-center py-4 px-4 text-sm font-bold rounded-2xl text-white bg-indigo-600 hover:bg-indigo-500 transition-all shadow-lg shadow-indigo-600/25 active:scale-[0.98]">
            <a href="homedashboard.html">Sign In</a>
            <i data-lucide="arrow-right" class="ml-2 h-5 w-5 group-hover:translate-x-1 transition-transform"></i>
          </button>
        </form>

        <!-- Sign Up Icon/Button (Footer) -->
        <div class="mt-10 text-center">
          <p class="text-sm text-slate-500 flex flex-col items-center justify-center space-y-4">
            <span>New to the system?</span>
            <a href="#" class="group/signup flex items-center space-x-2 px-6 py-2.5 rounded-xl bg-white/5 border border-white/10 text-indigo-400 hover:text-indigo-300 hover:bg-white/10 transition-all hover:scale-105 active:scale-95 shadow-xl">
              <i data-lucide="user-plus" class="w-4 h-4 group-hover/signup:scale-110 transition-transform"></i>
              <span class="font-bold tracking-tight">Create New Account</span>
            </a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <!-- Lucide Icon Initialization Script (Internal) -->
  <script>
    function initializeIcons() {
      if (window.lucide) {
        window.lucide.createIcons();
      } else {
        // Retry if script hasn't loaded yet
        setTimeout(initializeIcons, 100);
      }
    }
    // Run on load
    window.addEventListener('DOMContentLoaded', initializeIcons);
    // Extra insurance
    window.addEventListener('load', initializeIcons);
  </script>

  <!-- Optional script for functionality -->
  <script type="module" src="index.tsx"></script>
</body>
</html>
